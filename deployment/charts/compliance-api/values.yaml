replicaCount: 1
flaskEnv: production
cors_origin: https://compliance-web-c8b80a-dev.apps.gold.devops.gov.bc.ca,http://localhost:5173,https://dev.compliance.eao.gov.bc.ca

image:
  repository: compliance-api
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "dev"

resources:
  cpu:
    limit: 250m
    request: 150m
  memory:
    limit: 384Mi
    request: 256Mi

database:
  secret: compliance-patroni
  service:
    name: compliance-patroni
    port: 5432

authorize:
  base_url: https://auth-api-c72cba-dev.apps.gold.devops.gov.bc.ca

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

auth:
  jwt:
    alg: RS256
    aud: compliance-web
    cacheEnabled: true
    issuer: https://dev.loginproxy.gov.bc.ca/auth/realms/eao-epic
    cacheTimeout: "300"
    wellKnownConfig: https://dev.loginproxy.gov.bc.ca/auth/realms/eao-epic/.well-known/openid-configuration
  keycloak:
    uri: https://dev.loginproxy.gov.bc.ca
    realm:
    adminClientId:
    adminClientSecret:
python:
  pythonBuffered: 1
  connectTimeout: 60
cdogs:  
  tokenEndpoint: https://dev.loginproxy.gov.bc.ca/auth/realms/comsvcauth/protocol/openid-connect/token
  apiEndpoint: https://cdogs-test.api.gov.bc.ca/api/v2
  clientId:
  clientSecret:
gunicorn:
  workerCount: 1
  threadCount: 2
  connectionCount: 250
  timeout: 60
