apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: "{{ .Chart.Name }}"
  name: "{{ .Chart.Name }}"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-secret-{{ .Values.vault.secretName }}: {{ .Values.vault.path }}
        vault.hashicorp.com/agent-inject-template-{{ .Values.vault.secretName }}: |
          {{`{{`}} with secret "{{ .Values.vault.path }}" {{`}}`}}
          {{`{{`}} range $k, $v := .Data.data {{`}}`}}
          export {{`{{`}} $k {{`}}`}}="{{`{{`}} $v {{`}}`}}"
          {{`{{`}} end {{`}}`}}
          {{`{{`}} end {{`}}`}}
        vault.hashicorp.com/agent-inject-token: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/auth-path: {{ .Values.vault.authPath }}
        vault.hashicorp.com/namespace: {{ .Values.vault.namespace }}
        vault.hashicorp.com/role: {{ .Values.vault.role }}
    spec:
      initContainers:
      - name: pre-hook
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        command: ["/opt/app-root/pre-hook-update-db.sh"]
        resources:
          limits:
            cpu: {{ .Values.resources.cpu.limit }}
            memory: {{ .Values.resources.memory.limit }}
          requests:
            cpu: {{ .Values.resources.cpu.request }}
            memory: {{ .Values.resources.memory.request }}
        env:
          - name: DATABASE_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ .Values.database.secret }}
                key: app-db-username
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.database.secret }}
                key: app-db-password
          - name: DATABASE_NAME
            valueFrom:
              secretKeyRef:
                name: {{ .Values.database.secret }}
                key: app-db-name
          - name: DATABASE_HOST
            value: {{ .Values.database.service.name }}
          - name: DATABASE_PORT
            value: "{{ .Values.database.service.port }}"
          - name: FLASK_ENV
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: FLASK_ENV
        imagePullPolicy: {{ .Values.image.pullPolicy }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        resources:
          limits:
            cpu: {{ .Values.resources.cpu.limit }}
            memory: {{ .Values.resources.memory.limit }}
          requests:
            cpu: {{ .Values.resources.cpu.request }}
            memory: {{ .Values.resources.memory.request }}
        readinessProbe:
          httpGet:
            path: /ops/readyz
            port: 8080
            scheme: HTTP
          timeoutSeconds: 10
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /ops/healthz
            port: 8080
            scheme: HTTP
          timeoutSeconds: 10
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        env:
          - name: DATABASE_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ .Values.database.secret }}
                key: app-db-username
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.database.secret }}
                key: app-db-password
          - name: DATABASE_NAME
            valueFrom:
              secretKeyRef:
                name: {{ .Values.database.secret }}
                key: app-db-name
          - name: DATABASE_HOST
            value: {{ .Values.database.service.name }}
          - name: CORS_ORIGIN
            value: {{ .Values.cors_origin }}
          - name: DATABASE_PORT
            value: "{{ .Values.database.service.port }}"
          - name: FLASK_ENV
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: FLASK_ENV
          - name: JWT_OIDC_ALGORITHMS
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: JWT_OIDC_ALGORITHMS
          - name: JWT_OIDC_AUDIENCE
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: JWT_OIDC_AUDIENCE
          - name: JWT_OIDC_CACHING_ENABLED
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: JWT_OIDC_CACHING_ENABLED
          - name: JWT_OIDC_ISSUER
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: JWT_OIDC_ISSUER
          - name: JWT_OIDC_JWKS_CACHE_TIMEOUT
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: JWT_OIDC_JWKS_CACHE_TIMEOUT
          - name: JWT_OIDC_WELL_KNOWN_CONFIG
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: JWT_OIDC_WELL_KNOWN_CONFIG
          - name: PYTHONBUFFERED
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: PYTHONBUFFERED
          - name: KEYCLOAK_BASE_URL
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: KEYCLOAK_BASE_URL
          - name: KEYCLOAK_REALM_NAME
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: KEYCLOAK_REALM_NAME
          - name: KEYCLOAK_ADMIN_CLIENT
            valueFrom:
              secretKeyRef:
                name: {{ .Chart.Name }}
                key: KEYCLOAK_ADMIN_CLIENT
          - name: KEYCLOAK_ADMIN_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Chart.Name }}
                key: KEYCLOAK_ADMIN_SECRET
          - name: CONNECT_TIMEOUT
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: CONNECT_TIMEOUT
          - name: DOC_SERVICE_URL
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: DOC_SERVICE_URL
          - name: EPIC_TRACK_URL
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: EPIC_TRACK_URL
          - name: AUTH_BASE_URL
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: AUTH_BASE_URL
          - name: STORAGE_HOST_URL
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: STORAGE_HOST_URL
          - name: S3_BUCKET
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: S3_BUCKET
          - name: DOCGEN_SERVICE_URL
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: DOCGEN_SERVICE_URL
          - name: GUNICORN_WORKERS
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: GUNICORN_WORKERS
          - name: GUNICORN_WORKER_THREADS
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: GUNICORN_WORKER_THREADS
          - name: GUNICORN_WORKER_CONNECTIONS
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: GUNICORN_WORKER_CONNECTIONS
          - name: GUNICORN_TIMEOUT
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: GUNICORN_TIMEOUT
        ports:
          - containerPort: 8080
            protocol: TCP
        imagePullPolicy: {{ .Values.image.pullPolicy }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler