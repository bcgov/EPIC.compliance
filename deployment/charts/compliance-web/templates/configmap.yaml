apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: {{ .Chart.Name }}
  name: {{ .Chart.Name }}
data:
  config.js: |-
    // runtime-config.js vars
      window["_env_"] =  {
        "VITE_API_URL": "{{ .Values.app.api }}",
        "VITE_ENV": "{{ .Values.app.env }}",
        "VITE_AUTH_API_URL": "{{ .Values.app.auth_url }}",
        "VITE_TRACK_API_URL": "{{ .Values.app.track_api_url }}",
        "VITE_VERSION": "{{ .Values.app.version }}",
        "VITE_APP_TITLE": "EPIC.compliance",
        "VITE_APP_URL": "{{ .Values.app.url }}",
        "VITE_OIDC_AUTHORITY": "{{ .Values.keycloak.url }}",
        "VITE_CLIENT_ID": "{{ .Values.keycloak.client }}",
        "VITE_DEFAULT_PAGE_SIZE": "{{ .Values.app.default_page_size }}",
        "VITE_INPROGRESS_FEATURES": "{{ .Values.app.in_progress_features }}",
        "VITE_DOCUMENT_API_URL": "{{ .Values.app.doc_service_url }}",
        "VITE_AWS_S3_URL": "{{ .Values.aws.s3_url }}",
        "VITE_AWS_S3_BUCKET_NAME": "{{ .Values.aws.s3_bucket}}",
        "VITE_CLIENT_ID": "{{ .Values.app.client_id }}",
      }
