# Codecov configuration for EPIC.compliance
#
# Both CI workflows are path-filtered (api-ci.yml only runs on compliance-api/**,
# web.ci.yml only on compliance-web/**), so any given PR uploads only one flag.
# carryforward keeps the other flag's last known coverage instead of reporting
# it as a drop to zero.

codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "50...80"
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        informational: true

flag_management:
  individual_flags:
    - name: compliance-api
      paths:
        - compliance-api/
      carryforward: true
    - name: compliance-web
      paths:
        - compliance-web/
      carryforward: true

# coverage.py reports files relative to <source>=compliance-api/src, so paths
# arrive as "compliance_api/...". nyc/lcov reports relative to compliance-web,
# so paths arrive as "src/...". Map both back to repo-root paths.
fixes:
  - "compliance_api/::compliance-api/src/compliance_api/"
  - "src/::compliance-web/src/"

ignore:
  - "compliance-api/migrations/**"
  - "compliance-api/tests/**"
  - "compliance-web/cypress/**"
  - "compliance-web/src/**/routeTree.gen.ts"
  - "**/*.stories.tsx"
  - "**/*.d.ts"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
