name: Deploy and Update Template

on:
  # Trigger 1: Auto - when template changes in develop branch (dev environment only)
  push:
    branches:
      - develop
    paths:
      - 'compliance-api/src/compliance_api/templates/**'
  
  # Trigger 2: Manual - workflow dispatch with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (dev/test/prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - prod
  
  # Trigger 3: Called from Deploy workflow
  workflow_call:
    inputs:
      environment:
        description: "Environment (test/prod)"
        required: true
        type: string

env:
  TEMPLATE_DIR: compliance-api/src/compliance_api/templates

jobs:
  update-template:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Determine environment and API host
        id: setup
        run: |
          # Determine environment based on trigger type
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Auto trigger - always dev environment
            ENVIRONMENT="dev"
            echo "Triggered by push to develop - using dev environment"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger - use selected environment
            ENVIRONMENT="${{ github.event.inputs.environment }}"
            echo "Manual trigger - using $ENVIRONMENT environment"
          elif [[ "${{ github.event_name }}" == "workflow_call" ]]; then
            # Called from Deploy workflow - use passed environment
            ENVIRONMENT="${{ inputs.environment }}"
            echo "Called from Deploy workflow - using $ENVIRONMENT environment"
          else
            echo "Unknown trigger type"
            exit 1
          fi
          
          # Set API host based on environment
          case $ENVIRONMENT in
            dev)
              API_HOST="docgen-api-c8b80a-dev.apps.gold.devops.gov.bc.ca"
              ;;
            test)
              API_HOST="docgen-api-c8b80a-test.apps.gold.devops.gov.bc.ca"
              ;;
            prod)
              API_HOST="docgen-api-c8b80a-prod.apps.gold.devops.gov.bc.ca"
              ;;
            *)
              echo "Invalid environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "api_host=$API_HOST" >> $GITHUB_OUTPUT
          echo "Using API host: $API_HOST"

      - name: Update Templates
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ENVIRONMENT: ${{ steps.setup.outputs.environment }}
          API_HOST: ${{ steps.setup.outputs.api_host }}
        run: |
          echo "Updating templates in: ${TEMPLATE_DIR}"
          
          for file_path in ${TEMPLATE_DIR}/*.html; do
            template_name=$(basename "$file_path" .html)
            template_name_upper=${template_name^^}   # convert to caps
            echo "Processing: $template_name"
            
            template_base64=$(base64 -w 0 "$file_path")
            echo "Base64 length: ${#template_base64} characters"
            echo "$template_base64"
            
            response=$(curl -s -w "\n%{http_code}" -X PATCH \
              "https://${API_HOST}/api/templates/${template_name}" \
              -H "X-API-Key: ${API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"template_content\":\"${template_base64}\",\"app\":\"COMPLIANCE\"}")
            
            http_code=$(echo "$response" | tail -n1)
            
            if [[ $http_code -ge 200 && $http_code -lt 300 ]]; then
              echo "Updated $template_name successfully"
            else
              echo "Failed to update $template_name (HTTP: $http_code)"
              echo "$response" | head -n -1
              exit 1
            fi
            echo "---"
          done
          
          echo "All templates updated for $ENVIRONMENT environment"
